<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xarita Paneli va O'lchash</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Measure CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-measure@3.1.0/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: #f0f2f5; }

        #sidebar { width: 380px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
        #map { flex-grow: 1; height: 100%; }
        h2 { font-size: 20px; margin-bottom: 20px; color: #1a73e8; display: flex; align-items: center; gap: 8px; }
        .section { margin-bottom: 18px; background: #f8f9fa; padding: 14px; border-radius: 8px; border: 1px solid #e1e4e8; }
        .section label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 6px; color: #333; }
        input[type="file"], input[type="text"], select { width: 100%; font-size: 12px; padding: 8px; background: white; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; margin-top: 4px; }
        button { background: #2ea44f; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; width: 100%; margin-top: 8px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #2c974b; }
        .btn-secondary { background: #0366d6; }
        .btn-secondary:hover { background: #005cc5; }
        .btn-warning { background: #e67e22; color: white; }
        .btn-warning:hover { background: #d35400; }
        
        ul { list-style: none; margin-top: 8px; max-height: 100px; overflow-y: auto; font-size: 12px; }
        li { padding: 5px 8px; background: white; margin-bottom: 4px; border-radius: 4px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        
        .popup-table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 5px; }
        .popup-table th, .popup-table td { border: 1px solid #ccc; padding: 4px 6px; }
        .popup-table th { background: #e9ecef; }
        .hint { font-size: 11px; color: #666; margin-top: 4px; }

        @media(max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 50vh; }
            #map { height: 50vh; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>🗺️ Xarita Paneli</h2>
        
        <div class="section">
            <label>Yangi fayl qo'shish (GeoJSON, KML, SHP .zip):</label>
            <input type="file" id="fileInput" accept=".geojson,.json,.kml,.zip" multiple>
            <div class="hint">Poligonga bosib uni alohida yuklab olishingiz mumkin.</div>
            <ul id="fileList"></ul>
        </div>

        <!-- Geolokatsiya bloki -->
        <div class="section">
            <label>Mening joylashuvim:</label>
            <button class="btn-warning" onclick="locateUser()">📍 Geolokatsiyani aniqlash</button>
        </div>

        <!-- Qidirish bloki -->
        <div class="section" style="border: 2px solid #0366d6; background: #f1f8ff;">
            <label style="color: #0366d6;">🔍 Poligonni izlash (Qidiruv):</label>
            <select id="searchKeySelect">
                <option value="">-- Ustunni tanlang --</option>
            </select>
            <input type="text" id="searchInput" placeholder="Qidirilayotgan qiymat..." style="margin-top: 6px;">
            <button class="btn-secondary" onclick="searchFeature()" style="margin-top: 6px;">Izlash</button>
        </div>

        <div class="section">
            <label>Eksport qilish va Konvertatsiya:</label>
            <button class="btn-secondary" onclick="exportGeoJSON()">GeoJSON formatida saqlash</button>
            
            <div style="margin-top: 10px;">
                <label for="nameColumnSelect">KML uchun nom ustuni:</label>
                <select id="nameColumnSelect">
                    <option value="">-- Avtomatik (Obyekt raqami) --</option>
                </select>
            </div>
            <button class="btn-secondary" onclick="exportKML()">KML formatiga o'tkazish</button>
            <button class="btn-secondary" onclick="exportCSV()" style="margin-top: 8px;">Excel (CSV) formatiga olish</button>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet va Konverterlar JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@mapbox/togeojson@0.16.0/togeojson.js"></script>
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
    <!-- Leaflet Measure JS -->
    <script src="https://unpkg.com/leaflet-measure@3.1.0/dist/leaflet-measure.js"></script>

    <script>
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 18, attribution: '© OpenStreetMap' });
        const satelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 21,
            maxNativeZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '© Google Satellite'
        });

        const map = L.map('map', { center: [41.2995, 69.2401], zoom: 12, layers: [osmLayer] });
        L.control.layers({ "Standard": osmLayer, "Satellite": satelliteLayer }).addTo(map);

        L.control.measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares',
            activeColor: '#e74c3c',
            completedColor: '#2980b9'
        }).addTo(map);

        let featureCollection = { type: "FeatureCollection", features: [] };
        let currentLayer = null;
        let availableKeys = new Set();
        let layerMap = new Map();
        let highlightedLayer = null;
        let userMarker = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await loadData();
        });

        async function loadData() {
            let loaded = false;

            // 1. Tanlovi g'olibi aniqlangan qatlamini yuklash (Ko'k rangda bo'ladi)
            try {
                const res1 = await fetch(encodeURIComponent("tanlovi g'olibi aniqlangan.geojson") + '?t=' + new Date().getTime());
                if (res1.ok) {
                    const data1 = await res1.json();
                    if (data1 && Array.isArray(data1.features)) {
                        data1.features.forEach(f => {
                            f._layerType = 'winner'; // Turi: Golib
                            if (f.properties) Object.keys(f.properties).forEach(k => availableKeys.add(k));
                            featureCollection.features.push(f);
                        });
                        loaded = true;
                    }
                }
            } catch (e) {
                console.log("Goliblar faylini o'qishda xatolik:", e);
            }

            // 2. Savdoda qatlamini yuklash (Qizil/To'q sariq rangda bo'ladi)
            try {
                const res2 = await fetch(encodeURIComponent("Savdoda.geojson") + '?t=' + new Date().getTime());
                if (res2.ok) {
                    const data2 = await res2.json();
                    if (data2 && Array.isArray(data2.features)) {
                        data2.features.forEach(f => {
                            f._layerType = 'sale'; // Turi: Savdoda
                            if (f.properties) Object.keys(f.properties).forEach(k => availableKeys.add(k));
                            featureCollection.features.push(f);
                        });
                        loaded = true;
                    }
                }
            } catch (e) {
                console.log("Savdoda faylini o'qishda xatolik:", e);
            }

            if (!loaded) {
                const saved = localStorage.getItem('savedMapFeatures');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && Array.isArray(parsed.features)) {
                            featureCollection = parsed;
                            loaded = true;
                        }
                    } catch (err) {
                        console.error("LocalStorage xatoligi:", err);
                    }
                }
            }

            if (featureCollection.features.length > 0) {
                updateMap();
                updateColumnSelectors();
            }
        }

        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const files = e.target.files;
            const fileListEl = document.getElementById('fileList');

            for (let file of files) {
                const li = document.createElement('li');
                li.innerHTML = `<span>${file.name}</span>`;
                fileListEl.appendChild(li);

                const fileName = file.name.toLowerCase();
                try {
                    if (fileName.endsWith('.geojson') || fileName.endsWith('.json')) {
                        const text = await file.text();
                        addParsedData(JSON.parse(text), 'custom');
                    } 
                    else if (fileName.endsWith('.kml')) {
                        const text = await file.text();
                        const dom = new DOMParser().parseFromString(text, 'text/xml');
                        addParsedData(toGeoJSON.kml(dom), 'custom');
                    } 
                    else if (fileName.endsWith('.zip')) {
                        const buffer = await file.arrayBuffer();
                        const geojson = await shp(buffer);
                        if (Array.isArray(geojson)) {
                            geojson.forEach(item => addParsedData(item, 'custom'));
                        } else {
                            addParsedData(geojson, 'custom');
                        }
                    }
                } catch (err) {
                    console.error("Xatolik:", err);
                    alert(`"${file.name}" faylini o'qishda xatolik!`);
                }
            }

            localStorage.setItem('savedMapFeatures', JSON.stringify(featureCollection));
            updateMap();
            updateColumnSelectors();
        });

        function addParsedData(json, type = 'winner') {
            if (!json) return;
            let feats = [];
            if (json.type === "FeatureCollection" && Array.isArray(json.features)) {
                feats = json.features;
            } else if (json.type === "Feature") {
                feats = [json];
            } else if (Array.isArray(json)) {
                feats = json;
            } else if (json.geometry) {
                feats = [{ type: "Feature", geometry: json.geometry, properties: json.properties || {} }];
            }

            feats.forEach(f => {
                f._layerType = type;
                if (f.properties) {
                    Object.keys(f.properties).forEach(k => availableKeys.add(k));
                }
                featureCollection.features.push(f);
            });
        }

        function updateColumnSelectors() {
            const nameSelect = document.getElementById('nameColumnSelect');
            const searchSelect = document.getElementById('searchKeySelect');
            
            nameSelect.innerHTML = '<option value="">-- Avtomatik (Obyekt raqami) --</option>';
            searchSelect.innerHTML = '<option value="">-- Ustunni tanlang --</option>';

            availableKeys.forEach(key => {
                const opt1 = document.createElement('option');
                opt1.value = key; opt1.textContent = key;
                if (key.toLowerCase() === 'regnum' || key.toLowerCase() === 'reg_num') opt1.selected = true;
                nameSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = key; opt2.textContent = key;
                if (key.toLowerCase() === 'regnum' || key.toLowerCase() === 'reg_num') opt2.selected = true;
                searchSelect.appendChild(opt2);
            });
        }

        function updateMap() {
            if (currentLayer) map.removeLayer(currentLayer);
            layerMap.clear();
            highlightedLayer = null;

            try {
                currentLayer = L.geoJSON(featureCollection, {
                    style: function (feature) {
                        // Qatlam turiga qarab rang berish:
                        // 'sale' (Savdoda.geojson) -> Qizil/To'q sariq rang
                        // 'winner' (tanlovi g'olibi) -> Ko'k rang
                        if (feature && feature._layerType === 'sale') {
                            return { color: '#e74c3c', weight: 3, fillOpacity: 0.3, fillColor: '#e74c3c' };
                        } else {
                            return { color: '#3388ff', weight: 3, fillOpacity: 0.2, fillColor: '#3388ff' };
                        }
                    },
                    onEachFeature: function (feature, layer) {
                        layerMap.set(feature, layer);
                        if (feature && feature.properties) {
                            let featIndex = featureCollection.features.indexOf(feature);
                            let statusText = feature._layerType === 'sale' ? '<b style="color:#e74c3c;">Holati: Savdoda</b>' : '<b style="color:#3388ff;">Holati: Gʻolib aniqlangan</b>';
                            
                            let popupContent = `<div style='max-height:160px; overflow-y:auto;'>${statusText}<table class='popup-table' style='margin-top:6px;'><tr><th>Maydon</th><th>Qiymat</th></tr>`;
                            for (let key in feature.properties) {
                                popupContent += `<tr><td><b>${key}</b></td><td>${feature.properties[key]}</td></tr>`;
                            }
                            popupContent += `</table></div>
                                <div style="margin-top: 10px; padding-top: 8px; border-top: 1px solid #ddd; text-align: center;">
                                    <div style="font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #333;">Tanlangan obyektni yuklab olish:</div>
                                    <div style="display: flex; gap: 5px; justify-content: center;">
                                        <button onclick="downloadSingle(${featIndex}, 'geojson')" style="padding:6px 10px; font-size:11px; background:#0366d6; margin:0; width:auto; border-radius:4px;">GeoJSON</button>
                                        <button onclick="downloadSingle(${featIndex}, 'kml')" style="padding:6px 10px; font-size:11px; background:#2ea44f; margin:0; width:auto; border-radius:4px;">KML</button>
                                    </div>
                                </div>`;
                            layer.bindPopup(popupContent, { maxWidth: 300 });
                        }
                    }
                }).addTo(map);

                if (featureCollection.features.length > 0) {
                    map.fitBounds(currentLayer.getBounds());
                }
            } catch (e) {
                console.error("Xaritani chizishda xatolik:", e);
            }
        }

        function locateUser() {
            map.locate({ setView: true, maxZoom: 16 });
        }

        map.on('locationfound', function(e) {
            const radius = e.accuracy / 2;
            if (userMarker) {
                map.removeLayer(userMarker);
            }
            userMarker = L.marker(e.latlng).addTo(map)
                .bindPopup(`Siz shu yerdasiz (Aniqlik: ${Math.round(radius)} metr)`).openPopup();
        });

        map.on('locationerror', function(e) {
            alert("Geolokatsiyani aniqlab bo'lmadi: " + e.message);
        });

        function downloadSingle(index, format) {
            const feat = featureCollection.features[index];
            if (!feat) return;

            const singleCollection = { type: "FeatureCollection", features: [feat] };

            if (format === 'geojson') {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(singleCollection));
                const a = document.createElement('a');
                a.href = dataStr; a.download = `obyekt_${index + 1}.geojson`;
                document.body.appendChild(a); a.click(); a.remove();
            } 
            else if (format === 'kml') {
                let kml = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n`;
                kml += `  <Style id="redOutline">\n`;
                kml += `    <LineStyle><color>ff0000ff</color><width>3</width></LineStyle>\n`;
                kml += `    <PolyStyle><fill>0</fill></PolyStyle>\n`;
                kml += `  </Style>\n`;

                let objName = `Obyekt ${index + 1}`;
                kml += `  <Placemark>\n    <name>${objName}</name>\n    <styleUrl>#redOutline</styleUrl>\n`;
                if (feat.geometry && feat.geometry.coordinates) {
                    const geom = feat.geometry;
                    if (geom.type === "Polygon") {
                        kml += `    <Polygon>\n      <outerBoundaryIs>\n        <LinearRing>\n          <coordinates>\n`;
                        geom.coordinates[0].forEach(c => { kml += `            ${c[0]},${c[1]},0\n`; });
                        kml += `          </coordinates>\n        </LinearRing>\n      </outerBoundaryIs>\n    </Polygon>\n`;
                    }
                }
                kml += `  </Placemark>\n</Document>\n</kml>`;

                const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `obyekt_${index + 1}.kml`;
                a.click(); URL.revokeObjectURL(url);
            }
        }

        function searchFeature() {
            const searchKey = document.getElementById('searchKeySelect').value;
            const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();

            if (!searchKey || !searchValue) {
                alert("Iltimos, ustun va qidirilayotgan qiymatni kiriting!");
                return;
            }

            let found = false;
            featureCollection.features.forEach(feat => {
                if (feat.properties && feat.properties[searchKey] !== undefined) {
                    let val = String(feat.properties[searchKey]).toLowerCase();
                    if (val.includes(searchValue)) {
                        const layer = layerMap.get(feat);
                        if (layer) {
                            found = true;
                            if (highlightedLayer) {
                                let origColor = highlightedLayer.feature && highlightedLayer.feature._layerType === 'sale' ? '#e74c3c' : '#3388ff';
                                highlightedLayer.setStyle({ color: origColor, fillColor: origColor, weight: 3, fillOpacity: 0.2 });
                            }
                            highlightedLayer = layer;
                            layer.setStyle({ color: '#27ae60', fillColor: '#27ae60', fillOpacity: 0.7, weight: 5 }); // Topilganda yashil rangda yaltiraydi

                            if (layer.getBounds) {
                                map.fitBounds(layer.getBounds());
                            } else if (layer.getLatLng) {
                                map.setView(layer.getLatLng(), 16);
                            }
                            layer.openPopup();
                        }
                    }
                }
            });

            if (!found) alert("Bunday qiymatga ega obyekt topilmadi!");
        }

        function exportGeoJSON() {
            if (featureCollection.features.length === 0) { alert("Eksport uchun ma'lumot yo'q!"); return; }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(featureCollection));
            const a = document.createElement('a');
            a.href = dataStr; a.download = "birlashgan_xarita.geojson";
            document.body.appendChild(a); a.click(); a.remove();
        }

        function exportKML() {
            if (featureCollection.features.length === 0) { alert("Eksport uchun ma'lumot yo'q!"); return; }
            const selectedKey = document.getElementById('nameColumnSelect').value;
            
            let kml = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n`;
            kml += `  <Style id="redOutline">\n`;
            kml += `    <LineStyle><color>ff0000ff</color><width>3</width></LineStyle>\n`;
            kml += `    <PolyStyle><fill>0</fill></PolyStyle>\n`;
            kml += `  </Style>\n`;
            
            featureCollection.features.forEach((feat, idx) => {
                let objName = `Obyekt ${idx + 1}`;
                if (selectedKey && feat.properties && feat.properties[selectedKey] !== undefined) {
                    objName = feat.properties[selectedKey];
                }
                kml += `  <Placemark>\n    <name>${objName}</name>\n    <styleUrl>#redOutline</styleUrl>\n`;
                if (feat.geometry && feat.geometry.coordinates) {
                    const geom = feat.geometry;
                    if (geom.type === "Polygon") {
                        kml += `    <Polygon>\n      <outerBoundaryIs>\n        <LinearRing>\n          <coordinates>\n`;
                        geom.coordinates[0].forEach(c => { kml += `            ${c[0]},${c[1]},0\n`; });
                        kml += `          </coordinates>\n        </LinearRing>\n      </outerBoundaryIs>\n    </Polygon>\n`;
                    }
                }
                kml += `  </Placemark>\n`;
            });
            kml += `</Document>\n</kml>`;

            const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'xarita_tanlangan.kml';
            a.click(); URL.revokeObjectURL(url);
        }

        function exportCSV() {
            if (featureCollection.features.length === 0) { alert("Eksport uchun ma'lumot yo'q!"); return; }
            const keysArray = Array.from(availableKeys);
            let headers = ["Index", ...keysArray];
            let csvRows = [headers.join(",")];

            featureCollection.features.forEach((feat, index) => {
                let props = feat.properties || {};
                let row = [index + 1];
                keysArray.forEach(key => {
                    let val = props[key] !== undefined ? props[key] : "";
                    val = String(val).replace(/"/g, '""');
                    row.push(`"${val}"`);
                });
                csvRows.push(row.join(","));
            });

            const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csvRows.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "atributlar_jadval.csv");
            document.body.appendChild(link);
            link.click();
            link.remove();
        }
    </script>
</body>
</html>
