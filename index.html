<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xarita Paneli va Yuklab Olish</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- shpwrite (Shapefile yaratish uchun) -->
    <script src="https://unpkg.com/shpwrite@latest/shpwrite.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: #f0f2f5; }
        
        /* Login oynasi */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: flex;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box {
            background: white; padding: 30px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 320px; text-align: center;
        }
        .login-box h3 { margin-bottom: 15px; color: #1a73e8; }
        .login-box input {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 14px;
        }
        .login-box button {
            width: 100%; padding: 10px; background: #1a73e8; color: white;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: red; font-size: 12px; margin-top: 10px; display: none; }

        #sidebar { width: 420px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
        #map { flex-grow: 1; height: 100%; }
        h2 { font-size: 20px; margin-bottom: 20px; color: #1a73e8; display: flex; align-items: center; gap: 8px; }
        .section { margin-bottom: 18px; background: #f8f9fa; padding: 14px; border-radius: 8px; border: 1px solid #e1e4e8; }
        .section label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 6px; color: #333; }
        input[type="file"], input[type="text"], select { width: 100%; font-size: 12px; padding: 8px; background: white; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; margin-top: 4px; }
        button { background: #2ea44f; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; width: 100%; margin-top: 8px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #2c974b; }
        .btn-secondary { background: #0366d6; }
        .btn-secondary:hover { background: #005cc5; }
        .btn-danger { background: #d73a49; }
        .btn-danger:hover { background: #cb2431; }
        
        ul { list-style: none; margin-top: 8px; max-height: 100px; overflow-y: auto; font-size: 12px; }
        li { padding: 5px 8px; background: white; margin-bottom: 4px; border-radius: 4px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; font-size: 11px; border-collapse: collapse; margin-top: 8px; background: white; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        th { background: #f1f8ff; color: #333; }
        .table-container { max-height: 160px; overflow-y: auto; margin-top: 5px; border-radius: 6px; border: 1px solid #ddd; }
        
        .popup-table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 5px; }
        .popup-table th, .popup-table td { border: 1px solid #ccc; padding: 4px 6px; }
        .popup-table th { background: #e9ecef; }
        .hint { font-size: 11px; color: #666; margin-top: 4px; }

        @media(max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 55vh; }
            #map { height: 45vh; }
        }
    </style>
</head>
<body>

    <!-- Parol oynasi -->
    <div id="loginOverlay">
        <div class="login-box">
            <h3>🔒 Tizimga kirish</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Parolni kiriting:</p>
            <input type="password" id="passwordInput" placeholder="Parol...">
            <button onclick="checkPassword()" style="background: #1a73e8;">Kirish</button>
            <div id="errorMsg" class="error-msg">Parol noto'g'ri!</div>
        </div>
    </div>

    <div id="sidebar">
        <h2>🗺️ Xarita Paneli</h2>
        
        <div class="section">
            <label>Yangi fayl qo'shish (GeoJSON, KML, SHP .zip):</label>
            <input type="file" id="fileInput" accept=".geojson,.json,.kml,.zip" multiple>
            <div class="hint">Poligonga bosib uni alohida yuklab olishingiz mumkin.</div>
            <ul id="fileList"></ul>
        </div>

        <!-- Qidirish bloki -->
        <div class="section" style="border: 2px solid #0366d6; background: #f1f8ff;">
            <label style="color: #0366d6;">🔍 Poligonni izlash (Qidiruv):</label>
            <select id="searchKeySelect">
                <option value="">-- Ustunni tanlang --</option>
            </select>
            <input type="text" id="searchInput" placeholder="Qidirilayotgan qiymat..." style="margin-top: 6px;">
            <button class="btn-secondary" onclick="searchFeature()" style="margin-top: 6px;">Izlash</button>
        </div>

        <div class="section">
            <label>Boshqarish:</label>
            <button class="btn-danger" onclick="clearAllData()">Barcha ma'lumotlarni tozalash</button>
        </div>

        <div class="section">
            <label>Umumiy eksport:</label>
            <button class="btn-secondary" onclick="exportGeoJSON()">Barchasini GeoJSON saqlash</button>
            
            <div style="margin-top: 10px;">
                <label for="nameColumnSelect">KML uchun nom ustuni:</label>
                <select id="nameColumnSelect">
                    <option value="">-- Avtomatik (Obyekt raqami) --</option>
                </select>
            </div>
            <button class="btn-secondary" onclick="exportKML()">Barchasini KML saqlash</button>
            <button class="btn-secondary" onclick="exportCSV()" style="margin-top: 8px;">Excel (CSV) formatiga olish</button>
        </div>

        <div class="section">
            <label>Atributlar Jadvali:</label>
            <div class="table-container">
                <table id="attrTable">
                    <thead><tr><th>№</th><th>Atributlar (Xossalar)</th></tr></thead>
                    <tbody><tr><td colspan="2" style="text-align:center; color:#777;">Ma'lumot yo'q</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@mapbox/togeojson@0.16.0/togeojson.js"></script>
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>

    <script>
        const CORRECT_PASSWORD = "123"; 

        function checkPassword() {
            const inputVal = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (inputVal === CORRECT_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                errorMsg.style.display = 'none';
                try {
                    loadSavedData();
                } catch (err) {
                    console.error("Xatolik:", err);
                }
            } else {
                errorMsg.style.display = 'block';
            }
        }

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri' });

        const map = L.map('map', { center: [41.2995, 69.2401], zoom: 12, layers: [osmLayer] });
        L.control.layers({ "Standard": osmLayer, "Satellite": satelliteLayer }).addTo(map);

        let featureCollection = { type: "FeatureCollection", features: [] };
        let currentLayer = null;
        let availableKeys = new Set();
        let layerMap = new Map();
        let highlightedLayer = null;

        function loadSavedData() {
            const saved = localStorage.getItem('savedMapFeatures');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && Array.isArray(parsed.features)) {
                        featureCollection = parsed;
                        featureCollection.features.forEach(f => {
                            if (f.properties) Object.keys(f.properties).forEach(k => availableKeys.add(k));
                        });
                        updateMapAndTable();
                        updateColumnSelectors();
                    }
                } catch (e) {
                    console.error(e);
                    localStorage.removeItem('savedMapFeatures');
                }
            }
        }

        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const files = e.target.files;
            const fileListEl = document.getElementById('fileList');

            for (let file of files) {
                const li = document.createElement('li');
                li.innerHTML = `<span>${file.name}</span>`;
                fileListEl.appendChild(li);

                const fileName = file.name.toLowerCase();
                try {
                    if (fileName.endsWith('.geojson') || fileName.endsWith('.json')) {
                        const text = await file.text();
                        addParsedData(JSON.parse(text));
                    } 
                    else if (fileName.endsWith('.kml')) {
                        const text = await file.text();
                        const dom = new DOMParser().parseFromString(text, 'text/xml');
                        addParsedData(toGeoJSON.kml(dom));
                    } 
                    else if (fileName.endsWith('.zip')) {
                        const buffer = await file.arrayBuffer();
                        const geojson = await shp(buffer);
                        if (Array.isArray(geojson)) {
                            geojson.forEach(item => addParsedData(item));
                        } else {
                            addParsedData(geojson);
                        }
                    }
                } catch (err) {
