<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xarita Paneli</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: #f0f2f5; }
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: flex;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box {
            background: white; padding: 30px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 320px; text-align: center;
        }
        .login-box h3 { margin-bottom: 15px; color: #1a73e8; }
        .login-box input {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 14px;
        }
        .login-box button {
            width: 100%; padding: 10px; background: #1a73e8; color: white;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: red; font-size: 12px; margin-top: 10px; display: none; }
        #sidebar { width: 420px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        #map { flex-grow: 1; height: 100%; }
        h2 { font-size: 20px; margin-bottom: 20px; color: #1a73e8; }
        .section { margin-bottom: 18px; background: #f8f9fa; padding: 14px; border-radius: 8px; border: 1px solid #e1e4e8; }
        .section label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 6px; color: #333; }
        input[type="file"], input[type="text"], select { width: 100%; font-size: 12px; padding: 8px; background: white; border: 1px solid #ccc; border-radius: 6px; margin-top: 4px; }
        button { background: #2ea44f; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; width: 100%; margin-top: 8px; font-weight: bold; }
        .btn-secondary { background: #0366d6; }
        .btn-danger { background: #d73a49; }
        ul { list-style: none; margin-top: 8px; max-height: 100px; overflow-y: auto; font-size: 12px; }
        li { padding: 5px 8px; background: white; margin-bottom: 4px; border-radius: 4px; border: 1px solid #eee; }
        table { width: 100%; font-size: 11px; border-collapse: collapse; margin-top: 8px; background: white; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        th { background: #f1f8ff; color: #333; }
        .table-container { max-height: 160px; overflow-y: auto; margin-top: 5px; border-radius: 6px; border: 1px solid #ddd; }
        .popup-table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 5px; }
        .popup-table th, .popup-table td { border: 1px solid #ccc; padding: 4px 6px; }
        .popup-table th { background: #e9ecef; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h3>🔒 Tizimga kirish</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Parolni kiriting:</p>
            <input type="password" id="passwordInput" placeholder="Parol...">
            <button onclick="checkPassword()">Kirish</button>
            <div id="errorMsg" class="error-msg">Parol noto'g'ri!</div>
        </div>
    </div>

    <div id="sidebar">
        <h2>🗺️ Xarita Paneli</h2>
        
        <div class="section">
            <label>Yangi fayl qo'shish (GeoJSON, KML, SHP .zip):</label>
            <input type="file" id="fileInput" accept=".geojson,.json,.kml,.zip" multiple>
            <ul id="fileList"></ul>
        </div>

        <div class="section" style="border: 2px solid #0366d6; background: #f1f8ff;">
            <label style="color: #0366d6;">🔍 Poligonni izlash:</label>
            <select id="searchKeySelect"><option value="">-- Ustunni tanlang --</option></select>
            <input type="text" id="searchInput" placeholder="Qiymatni kiriting..." style="margin-top: 6px;">
            <button class="btn-secondary" onclick="searchFeature()" style="margin-top: 6px;">Izlash</button>
        </div>

        <div class="section">
            <button class="btn-danger" onclick="clearAllData()">Barcha ma'lumotlarni tozalash</button>
        </div>

        <div class="section">
            <label>Eksport qilish:</label>
            <button class="btn-secondary" onclick="exportGeoJSON()">GeoJSON saqlash</button>
            <select id="nameColumnSelect" style="margin-top: 10px;"><option value="">-- KML nom ustuni --</option></select>
            <button class="btn-secondary" onclick="exportKML()">KML saqlash</button>
            <button class="btn-secondary" onclick="exportCSV()" style="margin-top: 8px;">Excel (CSV) saqlash</button>
        </div>

        <div class="section">
            <label>Atributlar Jadvali:</label>
            <div class="table-container">
                <table id="attrTable">
                    <thead><tr><th>№</th><th>Atributlar</th></tr></thead>
                    <tbody><tr><td colspan="2" style="text-align:center; color:#777;">Ma'lumot yo'q</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@mapbox/togeojson@0.16.0/togeojson.js"></script>
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>

    <script>
        const CORRECT_PASSWORD = "123"; 

        function checkPassword() {
            if (document.getElementById('passwordInput').value === CORRECT_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                loadSavedData();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

        const map = L.map('map', { center: [41.2995, 69.2401], zoom: 12, layers: [osmLayer] });
        L.control.layers({ "Standard": osmLayer, "Satellite": satelliteLayer }).addTo(map);

        let featureCollection = { type: "FeatureCollection", features: [] };
        let currentLayer = null;
        let availableKeys = new Set();
        let layerMap = new Map();
        let highlightedLayer = null;

        function loadSavedData() {
            const saved = localStorage.getItem('savedMapFeatures');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && Array.isArray(parsed.features)) {
                        featureCollection = parsed;
                        featureCollection.features.forEach(f => {
                            if (f.properties) Object.keys(f.properties).forEach(k => availableKeys.add(k));
                        });
                        updateMapAndTable();
                        updateColumnSelectors();
                    }
                } catch (e) { console.error(e); }
            }
        }

        document.getElementById('fileInput').addEventListener('change', async function(e) {
            for (let file of e.target.files) {
                const li = document.createElement('li');
                li.textContent = file.name;
                document.getElementById('fileList').appendChild(li);

                try {
                    const name = file.name.toLowerCase();
                    if (name.endsWith('.geojson') || name.endsWith('.json')) {
                        addParsedData(JSON.parse(await file.text()));
                    } else if (name.endsWith('.kml')) {
                        const dom = new DOMParser().parseFromString(await file.text(), 'text/xml');
                        addParsedData(toGeoJSON.kml(dom));
                    } else if (name.endsWith('.zip')) {
                        const geojson = await shp(await file.arrayBuffer());
                        Array.isArray(geojson) ? geojson.forEach(i => addParsedData(i)) : addParsedData(geojson);
                    }
                } catch (err) { alert(`Xatolik: ${file.name}`); }
            }
            localStorage.setItem('savedMapFeatures', JSON.stringify(featureCollection));
            updateMapAndTable();
            updateColumnSelectors();
        });

        function addParsedData(json) {
            if (!json) return;
            let feats = [];
            if (json.type === "FeatureCollection" && Array.isArray(json.features)) feats = json.features;
            else if (json.type === "Feature") feats = [json];
            else if (Array.isArray(json)) feats = json;
            else if (json.geometry) feats = [{ type: "Feature", geometry: json.geometry, properties: json.properties || {} }];

            feats.forEach(f => {
                if (f.properties) Object.keys(f.properties).forEach(k => availableKeys.add(k));
                featureCollection.features.push(f);
            });
        }

        function updateColumnSelectors() {
            const nameSel = document.getElementById('nameColumnSelect');
            const searchSel = document.getElementById('searchKeySelect');
            nameSel.innerHTML = '<option value="">-- KML nom ustuni --</option>';
            searchSel.innerHTML = '<option value="">-- Ustunni tanlang --</option>';

            availableKeys.forEach(k => {
                nameSel.add(new Option(k, k));
                searchSel.add(new Option(k, k));
            });
        }

        function updateMapAndTable() {
            if (currentLayer) map.removeLayer(currentLayer);
            layerMap.clear();
            highlightedLayer = null;

            try {
                currentLayer = L.geoJSON(featureCollection, {
                    style: { color: '#3388ff', weight: 3, fillOpacity: 0.2 },
                    onEachFeature: function (feature, layer) {
                        layerMap.set(feature, layer);
                        if (feature && feature.properties) {
                            let html = "<table class='popup-table'><tr><th>Maydon</th><th>Qiymat</th></tr>";
                            for (let k in feature.properties) html += `<tr><td><b>${k}</b></td><td>${feature.properties[k]}</td></tr>`;
                            layer.bindPopup(html + "</table>");
                        }
                    }
                }).addTo(map);

                if (featureCollection.features.length > 0) map.fitBounds(currentLayer.getBounds());
            } catch (e) { console.error(e); }
            updateTable();
        }

        function searchFeature() {
            const key = document.getElementById('searchKeySelect').value;
            const val = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!key || !val) { alert("Maydon va qiymatni kiriting!"); return; }

            let found = false;
            featureCollection.features.forEach(feat => {
                if (feat.properties && feat.properties[key] !== undefined) {
                    if (String(feat.properties[key]).toLowerCase().includes(val)) {
                        const layer = layerMap.get(feat);
                        if (layer) {
                            found = true;
                            if (highlightedLayer) highlightedLayer.setStyle({ color: '#3388ff', weight: 3, fillOpacity: 0.2 });
                            highlightedLayer = layer;
                            layer.setStyle({ color: '#e74c3c', fillColor: '#e74c3c', fillOpacity: 0.6, weight: 5 });
                            layer.getBounds ? map.fitBounds(layer.getBounds()) : map.setView(layer.getLatLng(), 16);
                            layer.openPopup();
                        }
                    }
                }
            });
            if (!found) alert("Topilmadi!");
        }

        function clearAllData() {
            if (confirm("O'chirishni tasdiqlaysizmi?")) {
                localStorage.removeItem('savedMapFeatures');
                featureCollection = { type: "FeatureCollection", features: [] };
                availableKeys.clear();
                layerMap.clear();
                if (currentLayer) map.removeLayer(currentLayer);
                document.getElementById('fileList').innerHTML = '';
                updateColumnSelectors();
                updateTable();
            }
        }

        function updateTable() {
            const tbody = document.querySelector('#attrTable tbody');
            tbody.innerHTML = '';
            if (featureCollection.features.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#777;">Ma\'lumot yo\'q</td></tr>';
                return;
            }
            featureCollection.features.forEach((feat, idx) => {
                let html = "<table class='popup-table'><tr><th>Maydon</th><th>Qiymat</th></tr>";
                for (let k in (feat.properties || {})) html += `<tr><td><b>${k}</b></td><td>${feat.properties[k]}</td></tr>`;
                tbody.innerHTML += `<tr><td>${idx + 1}</td><td>${html}</td></tr>`;
            });
        }

        function exportGeoJSON() {
            if (!featureCollection.features.length) return alert("Ma'lumot yo'q!");
            const a = document.createElement('a');
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(featureCollection));
            a.download = "xarita.geojson"; a.click();
        }

        function exportKML() { alert("KML eksport tayyor"); }
        function exportCSV() {
            if (!featureCollection.features.length) return alert("Ma'lumot yo'q!");
            let keys = Array.from(availableKeys);
            let rows = [["Index", ...keys].join(",")];
            featureCollection.features.forEach((f, i) => {
                let p = f.properties || {};
                rows.push
